name: CI

on:
    push:
        branches: [main, dev, 'feature/**']
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: ci (node 22)
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Установка по lock-файлу
              run: npm ci

            - name: Типы
              run: npm run typecheck

            - name: Тесты
              run: npm test

            - name: Покрытие (пороги 80/60 не понижены)
              run: npm run test:coverage

            - name: Формат (Prettier)
              run: npm run format:check

            - name: Сборка
              run: npm run build

            - name: Линтер
              run: npm run lint

            - name: Бюджет строк и запреты (A84, Z42, TR-80)
              run: |
                  fail=0
                  for file in $(find src -type f \( -name '*.ts' -o -name '*.tsx' \)) \
                              $(find test -type f \( -name '*.test.ts' -o -name '*.test.tsx' \)); do
                      lines=$(wc -l < "$file")
                      if [ "$lines" -gt 200 ]; then echo "✗ $file: $lines > 200"; fail=1; fi
                  done
                  for file in $(find scripts -type f -name '*.mjs'); do
                      lines=$(wc -l < "$file")
                      if [ "$lines" -gt 250 ]; then echo "✗ $file: $lines > 250"; fail=1; fi
                  done
                  for file in $(find css -type f -name '*.css'); do
                      lines=$(wc -l < "$file")
                      if [ "$lines" -gt 200 ]; then echo "✗ $file: $lines > 200"; fail=1; fi
                  done
                  if grep -RIn ">= 100\|>= 70\|>= 40" src/core/game-rules.ts; then
                      echo "✗ пороги-литералы в src/core/game-rules.ts"; fail=1
                  fi
                  if grep -RIn "retry" src/core src/data src/hooks src/App.tsx; then
                      echo "✗ retry в src"; fail=1
                  fi
                  if grep -RIn "console\.log" src; then echo "✗ console.log в src"; fail=1; fi
                  if grep -RIn "from '../app" src/data; then echo "✗ data импортирует app"; fail=1; fi
                  if grep -RIn "SessionState" src; then echo "✗ SessionState в src"; fail=1; fi
                  if grep -RIn "confirm(\|alert(\|prompt(" src; then echo "✗ нативные диалоги в src"; fail=1; fi
                  exit "$fail"

            - name: Smoke собранного dist
              run: npm run smoke
